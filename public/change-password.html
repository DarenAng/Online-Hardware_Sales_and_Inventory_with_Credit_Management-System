<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Hardware Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2 style="text-align: center;">Create Your Password</h2>
        <p style="text-align: center; margin-bottom: 20px;">You must change your temporary password before continuing.</p>
        <form onsubmit="handlePasswordChange(event)">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input id="new-password" type="password" name="newPassword" class="form-control" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input id="confirm-password" type="password" name="confirmPassword" class="form-control" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 10px;">Save Password</button>
        </form>
    </div>
    <script src="javascript/app.js"></script>
</body>
</html>
