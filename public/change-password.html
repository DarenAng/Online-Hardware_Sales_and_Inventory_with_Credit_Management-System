<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your password - Hardware Sales &amp; Inventory</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/general-ui.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/modules/login.css">
</head>

<body class="login-body">
    <main class="login-card">
        <div class="login-brand">
            <span class="brand-mark">HW</span>
            <span class="brand-text">
                <span class="brand-name">Hardware</span>
                <span class="brand-sub">Sales &amp; Inventory</span>
            </span>
        </div>

        <h2>Choose your password</h2>
        <p class="login-lead">The password you were given is temporary. Pick your own before
            you carry on; it needs at least 8 characters.</p>

        <form onsubmit="handlePasswordChange(event)">
            <div class="form-group">
                <label for="new-password">New password</label>
                <input id="new-password" type="password" name="newPassword" class="form-control"
                       autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Type it again</label>
                <input id="confirm-password" type="password" name="confirmPassword" class="form-control"
                       autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-accent login-submit">Save password</button>
        </form>
    </main>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="javascript/modules/shared/helpers.js"></script>
    <script src="javascript/modules/shared/format.js"></script>
    <script src="javascript/modules/shared/ui-kit.js"></script>
    <script src="javascript/modules/shared/tables.js"></script>
    <script src="javascript/modules/shared/modals.js"></script>
    <script src="javascript/modules/shared/detail-modal.js"></script>
    <script src="javascript/modules/shared/session.js"></script>
    <script src="javascript/modules/shared/topbar.js"></script>
    <script src="javascript/modules/shared/my-account.js"></script>
    <script src="javascript/modules/shared/notifications.js"></script>
</body>
</html>
