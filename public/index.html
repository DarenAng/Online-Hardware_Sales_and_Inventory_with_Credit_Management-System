<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hardware Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">Welcome, <span data-current-user>User</span></div>
            <ul class="sidebar-nav">
                <li><a href="index.html">Main Dashboard</a></li>
                <li><a href="pos.html">POS & Sales</a></li>
                <li><a href="inventory.html">Inventory Management</a></li>
                <li><a href="records.html">Record Maintenance</a></li>
                <li><a href="delivery.html">Customer Delivery</a></li>
                <li><a href="reports.html">Reporting & Analytics</a></li>
                <li><a href="system.html">System Maintenance</a></li>
            </ul>
            <div class="sidebar-logout"><a href="Login.html" onclick="logout()">Logout</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            </header>

            <div class="content-area">
                <h2>Business Overview</h2>
                <div class="grid-3">
                    <div class="card">
                        <h3>Today's Sales</h3>
                        <h2 style="color: var(--success);">$4,250.00</h2>
                    </div>
                    <div class="card">
                        <h3>Low Stock Items</h3>
                        <h2 style="color: var(--danger);">14 Items</h2>
                    </div>
                    <div class="card">
                        <h3>Pending Deliveries</h3>
                        <h2 style="color: var(--accent);">8 Orders</h2>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="javascript/app.js"></script>
</body>
</html>
