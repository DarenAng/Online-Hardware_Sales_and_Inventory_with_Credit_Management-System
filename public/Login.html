<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Hardware Sales &amp; Inventory</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/general-ui.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/modules/login.css">
</head>

<body class="login-body">
    <main class="login-card">
        <div class="login-brand">
            <span class="brand-mark">HW</span>
            <span class="brand-text">
                <span class="brand-name">Hardware</span>
                <span class="brand-sub">Sales &amp; Inventory</span>
            </span>
        </div>

        <h2>Sign in</h2>
        <form onsubmit="handleLogin(event)">
            <!-- A refused sign-in is answered here, beside the two boxes it is
                 about, rather than in a card in the corner of the screen.
                 role="alert" so a screen reader announces it the moment it is
                 filled in, and aria-describedby ties it to the password box so
                 it is read out again when the cursor lands back there. It stays
                 until the next attempt: nothing on this screen is competing
                 with it for the space. -->
            <p class="login-alert" id="login-alert" role="alert" hidden></p>

            <div class="form-group">
                <label for="login-email">Email address</label>
                <input id="login-email" type="email" name="email" class="form-control"
                       autocomplete="username" required placeholder="name@hardware.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="password-field">
                    <input id="login-password" type="password" name="password" class="form-control"
                           autocomplete="current-password" required placeholder="Your password"
                           aria-describedby="login-alert">
                    <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
            </div>

            <button type="submit" class="btn btn-accent login-submit">Sign in</button>
        </form>

        <p class="login-foot">Forgotten your password? The system administrator can reset it
            for you.</p>
    </main>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="javascript/modules/shared/helpers.js"></script>
    <script src="javascript/modules/shared/format.js"></script>
    <script src="javascript/modules/shared/phone-picker.js"></script>
    <script src="javascript/modules/shared/ui-kit.js"></script>
    <script src="javascript/modules/shared/tables.js"></script>
    <script src="javascript/modules/shared/modals.js"></script>
    <script src="javascript/modules/shared/detail-modal.js"></script>
    <script src="javascript/modules/shared/session.js"></script>
    <script src="javascript/modules/shared/topbar.js"></script>
    <script src="javascript/modules/shared/my-account.js"></script>
    <script src="javascript/modules/shared/notifications.js"></script>
</body>
</html>
