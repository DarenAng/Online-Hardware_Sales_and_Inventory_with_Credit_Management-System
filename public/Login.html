<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hardware Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
    <div class="login-card">
        <h2 style="text-align: center;">System Login</h2>
        <p style="text-align: center; margin-bottom: 20px;">Hardware Sales & Inventory</p>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="name@hardware.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 10px;">Login to Dashboard</button>
        </form>
    </div>
    <script src="javascript/app.js"></script>
</body>
</html>
